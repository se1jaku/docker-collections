[supervisord]
user                        = root
nodaemon                    = true

[program:crond]
priority                    = 10
command                     = crond -f -d 5
stdout_logfile              = /dev/stdout
stdout_logfile_maxbytes     = 0
redirect_stderr             = true
stopsignal                  = INT
autostart                   = true
autorestart                 = true
startsecs                   = 5
numprocs                    = 1
