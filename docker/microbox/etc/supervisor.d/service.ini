[supervisord]
user                        = root
nodaemon                    = true

[program:crond]
priority                    = 10
command                     = crond -f
stdout_logfile              = /dev/stdout
stdout_logfile_maxbytes     = 0
redirect_stderr             = true
stopsignal                  = INT
autostart                   = true
autorestart                 = true
startsecs                   = 5
numprocs                    = 1

[program:sing-box]
priority                    = 20
command                     = sing-box -D %(ENV_SINGBOX_DATA_DIR)s -C %(ENV_SINGBOX_CONFIG_DIR)s run
stdout_logfile              = /dev/stdout
stdout_logfile_maxbytes     = 0
redirect_stderr             = true
stopsignal                  = INT
autostart                   = true
autorestart                 = true
startsecs                   = 5
numprocs                    = 1
